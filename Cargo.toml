[package]
name = "majik-key"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "A post-quantum ready seed phrase account library for the Majikah ecosystem. Manages deterministic X25519 and ML-KEM-768 identities with Argon2id protection."
repository = "https://github.com/Majikah/majik-key-rs"
keywords = ["bip39", "mnemonic", "cryptography", "post-quantum", "ed25519"]
categories = ["cryptography", "authentication"]
readme = "README.md"
homepage = "https://majikah.solutions"

[lib]
name = "majik_key"       # crate names use underscores even if package uses hyphens
crate-type = ["lib"]      # add "cdylib" later only if you also target WASM/FFI

[features]
default = ["bitcoin", "solana"]
bitcoin = ["dep:bitcoin"]
solana = ["dep:bs58"]

[dependencies]
# core, always-on
bip39 = { version = "2", features = [
    "chinese-simplified",
    "chinese-traditional",
    "czech",
    "french",
    "italian",
    "japanese",
    "korean",
    "portuguese",
    "spanish",
] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
x25519-dalek = "3"
curve25519-dalek = "5"
aes-gcm = "0.11"
argon2 = "0.5"
sha2 = "0.11"
ml-kem = "0.3.2"
thiserror = "2.0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = { version = "1", features = ["zeroize_derive"] }
getrandom  = "0.4.3"  

# optional / feature-gated
bitcoin = { version = "0.32", optional = true }
bs58 = { version = "0.5", optional = true }
pbkdf2 = "0.13.0"
fips204 = "0.4.6"
jiff = "0.2.32"

[dev-dependencies]
hex = "0.4"



[workspace]
resolver = "2"
