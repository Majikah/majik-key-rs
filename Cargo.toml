[package]
name = "majik-key"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "A post-quantum ready seed phrase account library for the Majikah ecosystem. Pure-Rust multi-key registry (X25519, Ed25519, ML-KEM, ML-DSA, SLH-DSA, BTC/ETH/SOL) derived from one BIP-39 mnemonic and protected with Argon2id."
repository = "https://github.com/Majikah/majik-key-rs"
keywords = ["bip39", "mnemonic", "cryptography", "post-quantum", "ed25519"]
categories = ["cryptography", "authentication"]
readme = "README.md"
homepage = "https://majikah.solutions"

[lib]
name = "majik_key"
crate-type = ["lib"]

[dependencies]
# ── mnemonic / seed ──
bip39 = { version = "3.0.0", features = [
    "chinese-simplified", "chinese-traditional", "czech", "french", "italian",
    "japanese", "korean", "portuguese", "spanish", "zeroize",
] }

# ── classic curves ──
ed25519-dalek = "3"
curve25519-dalek = "5"

# ── symmetric / KDF / hashes ──
aes-gcm = "0.11.1"
argon2 = "0.6.0"
pbkdf2 = "0.13"
hkdf = "0.13"
sha2 = "0.11"

# ── post-quantum ──
ml-kem = { version = "0.3.2", features = ["getrandom"] }
fips204 = "0.4.6"
fips205 = "0.4"

# ── web3 (all pure Rust: RustCrypto secp256k1, no libsecp256k1 / C) ──
bip32 = { version = "0.6.0", features = ["alloc"] }
k256 = { version = "0.14", features = ["ecdsa", "schnorr", "arithmetic"] }
sha3 = "0.12"
ripemd = "0.2"
bech32 = "0.12"
bs58 = { version = "0.5", features = ["check"] }

# ── plumbing ──
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }
getrandom = "0.4.3"
jiff = "0.2.38"
thiserror = "2.0.21"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
hex = "0.4"

# Argon2id (64 MiB x 3 passes) is painfully slow unoptimised; keep test builds fast.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[workspace]
resolver = "2"
